<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转…</title>
<script>
(function(){
  var target = 'https://operfan.eu.cc/';
  var host = location.hostname.toLowerCase();
  // 部署在目标域名自身时不跳，避免自我循环
  if (host === 'operfan.eu.cc' || host === 'www.operfan.eu.cc') return;
  // 兜底：动态插入 meta refresh（仅非目标域名时），JS 跳转失败仍可跳
  var m = document.createElement('meta');
  m.httpEquiv = 'refresh';
  m.content = '0;url=' + target;
  document.head.appendChild(m);
  location.replace(target);
})();
</script>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:#f7f8fa;color:#5f6368;font-size:15px;text-align:center;padding:24px;
  }
  a{color:#3f51b5;text-decoration:none;font-weight:500}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <p>正在跳转至 <a href="https://operfan.eu.cc/">operfan.eu.cc</a>，如未自动跳转请点击此处。</p>
</body>
</html>
